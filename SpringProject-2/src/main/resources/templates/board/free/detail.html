<!DOCTYPE html>
<html>
<head th:replace="~{fragments/common/head :: HeadFragment}">
  

</head>
<body>
  <header header th:replace="~{fragments/common/header :: HeaderFragment}">
  
  </header>

  <nav th:replace="~{fragments/common/nav :: NavFragment}">
    
  </nav>

  <section class="container mt-4" style="height: 70vh">
    <div class="card text-center" style="height: 100%">
        <div class="card-header">
            <h2 id="fb-title" th:text="${text.boardTitle}"></h2>
        </div>
        <div class="card-body">
            <div class="d-flex justify-content-center mb-3">
                <div class="mx-3">작성자: <span id="fb-writer" th:text="${text.authorDTO.authorId}"></span></div>
                <div class="mx-3">작성일: <span id="fb-date" th:text="${text.createDate}"></span></div>
                <div class="mx-3">조회수: <span id="fb-views" th:text="${text.boardCount}"></span></div>
            </div>
            <hr> 
            <div style="margin-top:20px; margin-bottom: 20px;">
            	<img th:src="@{{resourcesPath}/{folderNamePath}/{changeName}
                           (resourcesPath=${text.fileDTO.RESOURCES_PATH},
                           folderNamePath=${text.fileDTO.folderNamePath},
                           changeName=${text.fileDTO.changeName})}"
                           th:if="${text.fileDTO != null}"></img>
                <p class="card-text" th:text="${text.boardContent}">
                    
                </p>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-center">
            <button class="btn btn-secondary mx-2" onclick="window.history.back()">뒤로가기</button>
            
            <th:block th:if="${text.authorDTO.authorId == session.memberId}">
            <form th:action="@{/board/free/updateForm}" method="GET">
            <input type="hidden" name="boardNo" th:value="${text.boardNo}">
            <button type="submit" class="btn btn-primary mx-2">수정</button>     
            </form>
            
            <form th:action="@{/board/free/delete}" method="POST">
            	<input type="hidden" name="boardNo" th:value="${text.boardNo}">
            	<input type="hidden" name="fileName" th:value="${text.fileDTO.changeName}"
            		th:if="${text.fileDTO != null}">
            <button type="submit" class="btn btn-danger mx-2">삭제</button>
            </form>
            
            </th:block>
        </div>
    </div>
</section>
  <footer th:replace="~{fragments/common/footer :: FooterFragment}">
  
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
